name: Keep the API awake

# Render's free plan puts the API to sleep after 15 minutes without visitors, and waking it
# takes about a minute. A health check every 14 minutes keeps it awake (~720 hours a month,
# inside the free plan's 750). Uses the repository variable API_URL, e.g.
# https://tracelens-api.onrender.com. GitHub may run scheduled jobs a few minutes late.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 "${{ vars.API_URL }}/api/v1/health"
